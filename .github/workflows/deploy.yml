name: Saytni yig'ish va hostingga yuklash

# main ga har bir o'zgarish (admin paneldagi "Saqlash" ham) va har tunda
# 00:05 da (Toshkent) — muddati tugagan aksiyalar JavaScript'siz ham yo'qolsin.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 19 * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # FTP ma'lumotlari GitHub > Settings > Secrets and variables > Actions da:
      # FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (masalan public_html/),
      # ixtiyoriy FTP_PROTOCOL (ftps yoki ftp). Ular bo'lmasa, faqat build tekshiriladi.
      - name: Hostingga yuklash
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Serverdagi kalitlar va admin bazasiga hech qachon tegilmaydi.
          exclude: |
            **/.git*
            **/.git*/**
            api/secrets.php
            admin/_data/**
