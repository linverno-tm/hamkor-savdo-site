name: Saytni yig'ish va hostingga yuklash

# main ga har bir o'zgarish (admin paneldagi "Saqlash" ham) va har tunda
# 00:05 da (Toshkent) — muddati tugagan aksiyalar JavaScript'siz ham yo'qolsin.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "5 19 * * *"

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Vaqtinchalik tashxis: Next'ning sahifa payload fayllari hostingda
      # topilmadi, lekin ildizdagi bittasi yetib bordi. Sabab ikkitadan
      # biri — yo build ularni bu yerda boshqacha nomlaydi (CI Linux,
      # ishlab chiqish Windows), yo yuklovchi nuqtali papkalarni tashlab
      # ketyapti. Ro'yxat ikkisini ajratadi. Masala hal bo'lgach o'chiring.
      - name: Payload fayllari qanday nomlangan
        run: |
          echo "== __next* fayllar =="
          find out -name "*__PAGE__*" | sort
          echo
          echo "== nuqtali papkalar =="
          find out -type d -name "*.*" | sort | head -20
          echo
          echo "jami fayl: $(find out -type f | wc -l)"

      # FTP ma'lumotlari GitHub > Settings > Secrets and variables > Actions da:
      # FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR (masalan public_html/),
      # ixtiyoriy FTP_PROTOCOL (ftps yoki ftp). Ular bo'lmasa, faqat build tekshiriladi.
      - name: Hostingga yuklash
        if: ${{ env.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Serverdagi kalitlar va admin bazasiga hech qachon tegilmaydi.
          #
          # `**/secrets.php` — `api/secrets.php` ning o'zi ham yetarli, lekin
          # bu fayl serverdagi Telegram kaliti va admin paroli hashini
          # saqlaydi. Uni bir marta ustiga yozib yuborish panelga kirishni
          # yo'qotadi, shuning uchun himoya ikki qavat.
          #
          # `admin/_data/**` — arizalar bazasi. U faqat serverda yashaydi;
          # mahalliy `out/admin/_data/hamkor.sqlite` sinov ma'lumoti bilan
          # to'lgan bo'ladi va yuklansa, haqiqiy arizalar o'chib ketardi.
          exclude: |
            **/.git*
            **/.git*/**
            api/secrets.php
            **/secrets.php
            admin/_data/**

      # Yuklash muvaffaqiyatli tugadi — endi saytning o'zi sog'ligini
      # tekshiramiz. Bu xostingda nginx (Engintron) Apache oldida turadi va
      # statik fayllarni ba'zan o'zi beradi, ya'ni `.htaccess` chetlab
      # o'tiladi. Shunda sayt ko'zga chiroyli ko'rinadi, lekin maxfiy
      # fayllar ochilib qolishi yoki kirillcha 404 yo'qolishi mumkin.
      # Skript har bir qoidani alohida so'rov bilan sinaydi.
      - name: Saytni tekshirish
        if: ${{ env.FTP_SERVER != '' }}
        run: |
          sleep 20   # nginx keshi yangilansin
          node tools/joylashuvni-tekshir.mjs "${{ secrets.SAYT_URL || 'https://hamkorsavdo.uz' }}"
